<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Anteprima icone Come muoversi</title>
  <desc id="desc">Icona principale e sei icone per bus, treni, metropolitana, funicolari e ascensori, navi e battelli, aereo.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0a1c30" flood-opacity=".18"/></filter>
    <style>
      .card{fill:#f7f9fb;stroke:#cbd7e1;stroke-width:2}.name{font:700 23px system-ui,sans-serif;fill:#12283b}.note{font:500 14px system-ui,sans-serif;fill:#60778a}.badge{font:750 17px system-ui,sans-serif;fill:#fff}.glyph{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-width:3.5}.markerRing{fill:#fff;stroke:#142536;stroke-width:2.5}
    </style>
    <symbol id="move-main" viewBox="0 0 64 64"><g class="glyph"><circle cx="32" cy="32" r="7"/><path d="M32 25V10M32 10l-5 6M32 10l5 6M39 32h15M54 32l-6-5M54 32l-6 5M32 39v15M32 54l-5-6M32 54l5-6M25 32H10M10 32l6-5M10 32l6 5"/><circle cx="32" cy="32" r="18" stroke-opacity=".55"/></g></symbol>
    <symbol id="bus" viewBox="0 0 64 64"><g class="glyph"><path d="M17 12h30c5 0 8 4 8 9v25H9V21c0-5 3-9 8-9Z"/><path d="M15 20h34v15H15zM9 40h46M18 46v6M46 46v6"/><circle cx="18" cy="40" r="2.5" fill="#fff" stroke="none"/><circle cx="46" cy="40" r="2.5" fill="#fff" stroke="none"/><path d="M23 12V8h18v4"/></g></symbol>
    <symbol id="train" viewBox="0 0 64 64"><g class="glyph"><path d="M19 10h26c5 0 8 4 8 9v24c0 5-4 9-9 9H20c-5 0-9-4-9-9V19c0-5 3-9 8-9Z"/><path d="M17 18h30v16H17zM21 52l-6 7M43 52l6 7M22 59h20"/><circle cx="20" cy="42" r="3" fill="#fff" stroke="none"/><circle cx="44" cy="42" r="3" fill="#fff" stroke="none"/><path d="M28 10V6h8v4"/></g></symbol>
    <symbol id="metro" viewBox="0 0 64 64"><g class="glyph"><circle cx="32" cy="32" r="24"/><path d="M19 45V19l13 16 13-16v26M16 51h32"/></g></symbol>
    <symbol id="funi" viewBox="0 0 64 64"><g class="glyph"><path d="M8 49 56 29M11 55l48-20"/><path d="m22 25 24-10 7 17-24 10-7-17Z"/><path d="m29 24 6-2.5 3 7-6 2.5zM39 20l6-2.5 3 7-6 2.5zM18 48l3 7M30 43l3 7M42 38l3 7M54 33l3 7"/></g></symbol>
    <symbol id="sea" viewBox="0 0 64 64"><g class="glyph"><path d="M10 35h44l-7 13H17L10 35Z"/><path d="M20 35l5-15h17l5 15M28 20v-7h8v7M15 53c4-3 7-3 11 0s7 3 11 0 7-3 12 0"/><path d="M27 27h5M37 27h5"/></g></symbol>
    <symbol id="air" viewBox="0 0 64 64"><g class="glyph"><path d="m8 35 20 4 7 16 6-2-3-17 15-9c4-3 5-7 3-9-2-2-6-1-9 1l-14 9-14-9-5 3 10 12-16 1Z"/></g></symbol>
  </defs>
  <rect width="1400" height="760" rx="30" fill="#eaf1f6"/>
  <text x="50" y="50" font-family="system-ui,sans-serif" font-size="28" font-weight="760" fill="#10283d">Come muoversi · anteprima della famiglia di icone</text>
  <text x="50" y="78" font-family="system-ui,sans-serif" font-size="15" fill="#60778a">Palette fredda e coordinata; il rosso della Metropolitana rimane come segno riconoscibile.</text>

  <!-- Riga superiore -->
  <g transform="translate(38 110)"><rect class="card" width="315" height="275" rx="22" filter="url(#shadow)"/><circle cx="30" cy="30" r="17" fill="#1e3a8a"/><text class="badge" x="30" y="36" text-anchor="middle">C</text><g transform="translate(88 27)"><rect width="108" height="108" rx="31" fill="#1e3a8a"/><rect x="3" y="3" width="102" height="102" rx="28" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><use href="#move-main" x="20" y="20" width="68" height="68"/></g><circle class="markerRing" cx="202" cy="125" r="27"/><circle cx="202" cy="125" r="22" fill="#1e3a8a"/><use href="#move-main" x="184" y="107" width="36" height="36"/><text class="name" x="157.5" y="183" text-anchor="middle">Come muoversi</text><text class="note" x="157.5" y="211" text-anchor="middle">categoria principale</text></g>
  <g transform="translate(374 110)"><rect class="card" width="315" height="275" rx="22" filter="url(#shadow)"/><circle cx="30" cy="30" r="17" fill="#167d91"/><text class="badge" x="30" y="36" text-anchor="middle">1</text><g transform="translate(88 27)"><rect width="108" height="108" rx="31" fill="#167d91"/><rect x="3" y="3" width="102" height="102" rx="28" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><use href="#bus" x="20" y="20" width="68" height="68"/></g><circle class="markerRing" cx="202" cy="125" r="27"/><circle cx="202" cy="125" r="22" fill="#167d91"/><use href="#bus" x="184" y="107" width="36" height="36"/><text class="name" x="157.5" y="183" text-anchor="middle">Autobus</text><text class="note" x="157.5" y="211" text-anchor="middle">blu petrolio</text></g>
  <g transform="translate(710 110)"><rect class="card" width="315" height="275" rx="22" filter="url(#shadow)"/><circle cx="30" cy="30" r="17" fill="#3f648e"/><text class="badge" x="30" y="36" text-anchor="middle">2</text><g transform="translate(88 27)"><rect width="108" height="108" rx="31" fill="#3f648e"/><rect x="3" y="3" width="102" height="102" rx="28" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><use href="#train" x="20" y="20" width="68" height="68"/></g><circle class="markerRing" cx="202" cy="125" r="27"/><circle cx="202" cy="125" r="22" fill="#3f648e"/><use href="#train" x="184" y="107" width="36" height="36"/><text class="name" x="157.5" y="183" text-anchor="middle">Treni</text><text class="note" x="157.5" y="211" text-anchor="middle">blu acciaio</text></g>
  <g transform="translate(1046 110)"><rect class="card" width="315" height="275" rx="22" filter="url(#shadow)"/><circle cx="30" cy="30" r="17" fill="#d0444b"/><text class="badge" x="30" y="36" text-anchor="middle">3</text><g transform="translate(88 27)"><rect width="108" height="108" rx="31" fill="#d0444b"/><rect x="3" y="3" width="102" height="102" rx="28" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><use href="#metro" x="20" y="20" width="68" height="68"/></g><circle class="markerRing" cx="202" cy="125" r="27"/><circle cx="202" cy="125" r="22" fill="#d0444b"/><use href="#metro" x="184" y="107" width="36" height="36"/><text class="name" x="157.5" y="183" text-anchor="middle">Metropolitana</text><text class="note" x="157.5" y="211" text-anchor="middle">rosso identificativo</text></g>

  <!-- Riga inferiore -->
  <g transform="translate(206 420)"><rect class="card" width="315" height="275" rx="22" filter="url(#shadow)"/><circle cx="30" cy="30" r="17" fill="#7a667e"/><text class="badge" x="30" y="36" text-anchor="middle">4</text><g transform="translate(88 27)"><rect width="108" height="108" rx="31" fill="#7a667e"/><rect x="3" y="3" width="102" height="102" rx="28" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><use href="#funi" x="20" y="20" width="68" height="68"/></g><circle class="markerRing" cx="202" cy="125" r="27"/><circle cx="202" cy="125" r="22" fill="#7a667e"/><use href="#funi" x="184" y="107" width="36" height="36"/><text class="name" x="157.5" y="183" text-anchor="middle">Impianti verticali</text><text class="note" x="157.5" y="211" text-anchor="middle">funicolari e ascensori</text></g>
  <g transform="translate(542 420)"><rect class="card" width="315" height="275" rx="22" filter="url(#shadow)"/><circle cx="30" cy="30" r="17" fill="#187eae"/><text class="badge" x="30" y="36" text-anchor="middle">5</text><g transform="translate(88 27)"><rect width="108" height="108" rx="31" fill="#187eae"/><rect x="3" y="3" width="102" height="102" rx="28" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><use href="#sea" x="20" y="20" width="68" height="68"/></g><circle class="markerRing" cx="202" cy="125" r="27"/><circle cx="202" cy="125" r="22" fill="#187eae"/><use href="#sea" x="184" y="107" width="36" height="36"/><text class="name" x="157.5" y="183" text-anchor="middle">Navi e battelli</text><text class="note" x="157.5" y="211" text-anchor="middle">azzurro marino</text></g>
  <g transform="translate(878 420)"><rect class="card" width="315" height="275" rx="22" filter="url(#shadow)"/><circle cx="30" cy="30" r="17" fill="#4e73b8"/><text class="badge" x="30" y="36" text-anchor="middle">6</text><g transform="translate(88 27)"><rect width="108" height="108" rx="31" fill="#4e73b8"/><rect x="3" y="3" width="102" height="102" rx="28" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><use href="#air" x="20" y="20" width="68" height="68"/></g><circle class="markerRing" cx="202" cy="125" r="27"/><circle cx="202" cy="125" r="22" fill="#4e73b8"/><use href="#air" x="184" y="107" width="36" height="36"/><text class="name" x="157.5" y="183" text-anchor="middle">Aereo</text><text class="note" x="157.5" y="211" text-anchor="middle">blu cielo</text></g>
</svg>
