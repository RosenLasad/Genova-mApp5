<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="730" viewBox="0 0 1300 730" role="img" aria-labelledby="title desc">
  <title id="title">Anteprima icone Luoghi e Intrattenimento</title>
  <desc id="desc">Icona principale e cinque icone per parchi e piazze, sport, cinema, teatri e mostre.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#31210b" flood-opacity=".18"/></filter>
    <style>
      .card{fill:#fffaf0;stroke:#e5d5b6;stroke-width:2}.name{font:700 23px system-ui,sans-serif;fill:#30220f}.note{font:500 14px system-ui,sans-serif;fill:#806d50}.badge{font:750 17px system-ui,sans-serif;fill:#fff}.glyph{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-width:3.5}.markerRing{fill:#fff;stroke:#30220f;stroke-width:2.5}
    </style>
    <symbol id="fun-main" viewBox="0 0 64 64"><g class="glyph"><path d="M13 18h38v10a6 6 0 0 0 0 12v10H13V40a6 6 0 0 0 0-12V18Z"/><path d="m32 24 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L32 24Z"/><path d="M21 18v32M43 18v32" stroke-dasharray="2.5 5"/></g></symbol>
    <symbol id="parks" viewBox="0 0 64 64"><g class="glyph"><path d="M27 50V33M27 13 14 35h26L27 13ZM27 21 10 43h34L27 21Z"/><path d="M38 46h17M40 39h13v7H40zM42 46v6M52 46v6M8 52h48"/></g></symbol>
    <symbol id="sport" viewBox="0 0 64 64"><g class="glyph"><circle cx="32" cy="32" r="24"/><path d="m32 8 9 9-4 11H27l-4-11 9-9ZM27 28l-10 7-8-5M37 28l10 7 8-5M21 49l6-9h10l6 9M17 35l4 14M47 35l-4 14"/></g></symbol>
    <symbol id="cinema" viewBox="0 0 64 64"><g class="glyph"><path d="M11 23h42v30H11zM11 23l5-13 42 10-5 13"/><path d="m20 11 5 13M32 14l5 13M44 17l5 13M20 23h12l-6 10H14M44 23h12L50 33H38"/><path d="m28 37 12 7-12 7V37Z"/></g></symbol>
    <symbol id="theater" viewBox="0 0 64 64"><g class="glyph"><path d="M10 13h44v38H10V13ZM10 13c8 6 13 14 13 24s-5 14-13 14M54 13c-8 6-13 14-13 24s5 14 13 14M24 13v38M40 13v38"/><path d="M28 27c2-2 6-2 8 0M28 38c2 3 6 3 8 0"/></g></symbol>
    <symbol id="exhibition" viewBox="0 0 64 64"><g class="glyph"><path d="M10 12h44v38H10zM16 18h32v26H16z"/><circle cx="39" cy="25" r="4"/><path d="m17 42 10-11 7 7 5-5 9 9M25 50v6M39 50v6M18 56h28"/></g></symbol>
