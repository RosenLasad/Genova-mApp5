  <rect width="1300" height="730" rx="30" fill="#f5ead3"/>
  <text x="50" y="50" font-family="system-ui,sans-serif" font-size="28" font-weight="760" fill="#35240e">Luoghi / Intrattenimento · anteprima della famiglia di icone</text>
  <text x="50" y="78" font-family="system-ui,sans-serif" font-size="15" fill="#806d50">Una palette calda costruita attorno a giallo, ambra e ocra, con variazioni riconoscibili.</text>

  <g transform="translate(45 110)"><rect class="card" width="380" height="270" rx="22" filter="url(#shadow)"/><circle cx="31" cy="31" r="18" fill="#d99a16"/><text class="badge" x="31" y="37" text-anchor="middle">C</text><g transform="translate(110 24)"><rect width="108" height="108" rx="31" fill="#d99a16"/><rect x="3" y="3" width="102" height="102" rx="28" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><use href="#fun-main" x="20" y="20" width="68" height="68"/></g><circle class="markerRing" cx="224" cy="122" r="27"/><circle cx="224" cy="122" r="22" fill="#d99a16"/><use href="#fun-main" x="206" y="104" width="36" height="36"/><text class="name" x="190" y="180" text-anchor="middle">Luoghi / Intrattenimento</text><text class="note" x="190" y="208" text-anchor="middle">biglietto e stella</text></g>
  <g transform="translate(460 110)"><rect class="card" width="380" height="270" rx="22" filter="url(#shadow)"/><circle cx="31" cy="31" r="18" fill="#8a9a32"/><text class="badge" x="31" y="37" text-anchor="middle">1</text><g transform="translate(110 24)"><rect width="108" height="108" rx="31" fill="#8a9a32"/><rect x="3" y="3" width="102" height="102" rx="28" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><use href="#parks" x="20" y="20" width="68" height="68"/></g><circle class="markerRing" cx="224" cy="122" r="27"/><circle cx="224" cy="122" r="22" fill="#8a9a32"/><use href="#parks" x="206" y="104" width="36" height="36"/><text class="name" x="190" y="180" text-anchor="middle">Parchi e piazze</text><text class="note" x="190" y="208" text-anchor="middle">oliva dorato</text></g>
  <g transform="translate(875 110)"><rect class="card" width="380" height="270" rx="22" filter="url(#shadow)"/><circle cx="31" cy="31" r="18" fill="#c9791a"/><text class="badge" x="31" y="37" text-anchor="middle">2</text><g transform="translate(110 24)"><rect width="108" height="108" rx="31" fill="#c9791a"/><rect x="3" y="3" width="102" height="102" rx="28" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><use href="#sport" x="20" y="20" width="68" height="68"/></g><circle class="markerRing" cx="224" cy="122" r="27"/><circle cx="224" cy="122" r="22" fill="#c9791a"/><use href="#sport" x="206" y="104" width="36" height="36"/><text class="name" x="190" y="180" text-anchor="middle">Sport</text><text class="note" x="190" y="208" text-anchor="middle">arancio ocra</text></g>

  <g transform="translate(45 420)"><rect class="card" width="380" height="270" rx="22" filter="url(#shadow)"/><circle cx="31" cy="31" r="18" fill="#a97716"/><text class="badge" x="31" y="37" text-anchor="middle">3</text><g transform="translate(110 24)"><rect width="108" height="108" rx="31" fill="#a97716"/><rect x="3" y="3" width="102" height="102" rx="28" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><use href="#cinema" x="20" y="20" width="68" height="68"/></g><circle class="markerRing" cx="224" cy="122" r="27"/><circle cx="224" cy="122" r="22" fill="#a97716"/><use href="#cinema" x="206" y="104" width="36" height="36"/><text class="name" x="190" y="180" text-anchor="middle">Cinema</text><text class="note" x="190" y="208" text-anchor="middle">oro scuro</text></g>
