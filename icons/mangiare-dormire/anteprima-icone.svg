<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">Anteprima icone Mangiare e dormire</title>
  <desc id="desc">Quattro proposte per Locali, Ristoranti, Take-away e Alberghi e B&amp;B, mostrate come pulsante e marker.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#091522" flood-opacity=".2"/></filter>
    <style>
      .card{fill:#f7f4ed;stroke:#d8d1c3;stroke-width:2}.num{font:700 20px system-ui,sans-serif;fill:#fff}.name{font:700 24px system-ui,sans-serif;fill:#142536}.note{font:500 15px system-ui,sans-serif;fill:#587083}.icon{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-width:4}.markerRing{fill:#fff;stroke:#142536;stroke-width:2}
    </style>
  </defs>
  <rect width="1120" height="390" rx="28" fill="#e9eef1"/>
  <text x="48" y="47" font-family="system-ui,sans-serif" font-size="26" font-weight="750" fill="#102333">Mangiare e dormire · anteprima icone</text>
  <text x="48" y="73" font-family="system-ui,sans-serif" font-size="15" fill="#587083">Il simbolo resta identico nel pulsante e nel marker sulla mappa.</text>

